<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="meta-title">تفاصيل الخبر | Gmarik Magazine</title>

    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        :root {
            --primary-dark: #070d1b;
            --accent-gold: #e2b714;
            --accent-glow: rgba(226, 183, 20, 0.4);
            --bg-gradient: linear-gradient(135deg, #070d1b 0%, #111c33 50%, #1e293b 100%);
            --card-bg: rgba(15, 23, 42, 0.9);
        }

        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background: linear-gradient(135deg, #070d1b 0%, #0f172a 50%, #171d30 100%);
            color: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        header {
            background: rgba(7, 13, 27, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(226, 183, 20, 0.3);
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
        }
        .logo-text span { color: var(--accent-gold); }

        .btn-back {
            background: rgba(226, 183, 20, 0.15);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-back:hover { background: var(--accent-gold); color: #070d1b; }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .article-box {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(226, 183, 20, 0.2);
        }

        .article-box img {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
        }

        .article-body { padding: 25px 28px; }

        .article-body h1 {
            font-size: 1.5rem;
            margin: 0 0 15px 0;
            line-height: 1.5;
        }

        .article-description {
            color: #cbd5e1;
            font-size: 1.05rem;
            line-height: 1.9;
            margin-bottom: 25px;
        }

        .source-box {
            border-top: 1px dashed rgba(226, 183, 20, 0.3);
            padding-top: 18px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .source-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--bg-gradient);
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .source-name {
            color: #f1f5f9;
            font-weight: bold;
        }

        .loading-box, .error-box {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="btn-back">⬅ العودة للرئيسية</a>
        <div class="logo-text">جمارك <span>مجازين</span></div>
    </header>

    <div class="container">
        <div id="content-area">
            <div class="loading-box">⏳ جاري تحميل الخبر...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_pyEgRtBzObOTf-msTwC0nbhsyCmJ92s",
            authDomain: "gamarek.firebaseapp.com",
            projectId: "gamarek",
            storageBucket: "gamarek.firebasestorage.app",
            messagingSenderId: "139734553489",
            appId: "1:139734553489:web:1339f96b98cebd32610030",
            measurementId: "G-H1FRFXK1FG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const contentArea = document.getElementById('content-area');

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text || '';
            return div.innerHTML;
        }

        async function loadArticle() {
            const params = new URLSearchParams(window.location.search);
            const articleId = params.get('id');

            if (!articleId) {
                contentArea.innerHTML = '<div class="error-box">⚠ لم يتم تحديد الخبر المطلوب.</div>';
                return;
            }

            try {
                const docRef = doc(db, "articles", articleId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    contentArea.innerHTML = '<div class="error-box">⚠ هذا الخبر غير موجود أو تم حذفه.</div>';
                    return;
                }

                const article = docSnap.data();
                const title = escapeHtml(article.title);
                const description = escapeHtml(article.description);
                const image = article.image || '';
                const sourceName = escapeHtml(article.sourceName);
                const country = escapeHtml(article.country);
                const avatarLetter = article.sourceName ? article.sourceName.trim().charAt(0) : '؟';

                document.title = (article.title || 'خبر') + ' | Gmarik Magazine';

                contentArea.innerHTML = `
                    <div class="article-box">
                        ${image ? `<img src="${image}" alt="${title}">` : ''}
                        <div class="article-body">
                            <h1>${title}</h1>
                            ${description ? `<p class="article-description">${description}</p>` : ''}
                            <div class="source-box">
                                <div class="source-avatar">${avatarLetter}</div>
                                <div>
                                    <div>الخبر منقول عن: <span class="source-name">${sourceName}</span></div>
                                    ${country ? `<div>${country}</div>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('تعذر تحميل الخبر:', error);
                contentArea.innerHTML = '<div class="error-box">⚠ حدث خطأ أثناء تحميل الخبر. حاول مرة أخرى.</div>';
            }
        }

        loadArticle();
    </script>
</body>
</html>
